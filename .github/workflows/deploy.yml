# Deploy to Cloudflare Workers (docs/operations/DELIVERY.md §2, DEVELOPMENT_PLAN DP-3.1, DP-3.5).
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
#   preview    → Worker navweather-preview (its own Durable Objects, D1, R2 — test data), then the Worker smoke
#                tests against it (repository variable PREVIEW_URL, e.g. https://navweather-preview.<you>.workers.dev)
#   production → Worker navweather (real users; no smoke tests there — they would create shares and reports)
# Both build our places tiles and search index (Georgia, OpenStreetMap via Geofabrik) and load the index into the
# environment's D1. The forecast comes from the scheduled weather workflow (weather.yml).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: preview or production
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.target }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets first."
            exit 1
          fi
      - run: npm run check:envs
      - run: npm run typecheck
      - run: npm test
      - name: Our data (places tiles, search index)
        run: npm run data:download && npm run data:osm
      - name: Build (mode preview or production → .env.preview / .env.production)
        run: npm run ${{ inputs.target == 'preview' && 'build:preview' || 'build' }}
      - name: Deploy the Worker
        run: npx wrangler deploy --env ${{ inputs.target }} --message "${{ github.sha }}"
      - name: Load the search index into D1
        run: npx wrangler d1 execute navweather-geo-${{ inputs.target }} --env ${{ inputs.target }} --remote --file data/build/ge/geocode.sql
      - name: Worker smoke tests against preview
        if: inputs.target == 'preview' && vars.PREVIEW_URL != ''
        env:
          BASE_URL: ${{ vars.PREVIEW_URL }}
        run: |
          npm run test:share
          npm run test:reports
          npm run test:trips
          npm run test:geocode
          npm run test:route
          npm run test:weather
