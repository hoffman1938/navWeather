# navWeather on Cloudflare Workers: the static app (dist/) plus the live
# location relay (Durable Object). Everything fits the Workers Free plan.
#
#   npm run build && npx wrangler deploy     # deploy
#   npm run dev:api                          # local relay for `npm run dev`
#   npm run build && npx wrangler dev        # full stack locally (port 8787)
name = "navweather"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Only the API runs code; everything else is served straight from assets
# (with public/_headers applied).
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "LIVE_SHARE"
class_name = "LiveShare"

# Driver reports: one SQLite-backed object (no extra resource to create).
[[durable_objects.bindings]]
name = "REPORTS"
class_name = "Reports"

# Abuse guard for creating shares (per client IP).
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

# Abuse guard for reporting and "still there?" votes (per client IP).
[[ratelimits]]
name = "REPORT_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Abuse guard for reading reports (per client IP). A route asks for up to
# 24 boxes, every 5 minutes while driving — this leaves plenty of headroom.
[[ratelimits]]
name = "REPORT_LIST_LIMITER"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

# Abuse guard for the long-trip planner (per client IP). Each plan may make up
# to 12 Overpass queries (edge-cached by area), so keep this modest.
[[ratelimits]]
name = "TRIP_LIMITER"
namespace_id = "1004"
simple = { limit = 20, period = 60 }

# Long-trip planner: Overpass endpoints and the User-Agent sent to them (name a
# contact before production — Overpass asks apps to identify themselves).
[vars]
OVERPASS_URLS = "https://overpass-api.de/api/interpreter,https://overpass.kumi.systems/api/interpreter"
TRIP_USER_AGENT = "navWeather/0.1 (trip planner; Cloudflare Worker)"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveShare"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Reports"]

[observability]
enabled = false
