# Our forecast on schedule (DEVELOPMENT_PLAN DP-4.6): every hour, look for new ECMWF IFS / NOAA GFS runs in the
# Open-Meteo open-data archive and, when there are, build the weather tiles into the environment's R2 bucket
# (pipelines/weather/build.mjs; ~270 MB downloaded, ~0.8 GB written, 15–40 min). An hour without new runs ends in
# seconds. Free: GitHub Actions minutes are unlimited for public repositories (DP-0.3).
# Needs repository secrets CLOUDFLARE_API_TOKEN (with R2 edit) and CLOUDFLARE_ACCOUNT_ID; without them it does nothing.
name: Weather

on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:
    inputs:
      target:
        description: preview or production
        type: choice
        options: [production, preview]
        default: production

permissions:
  contents: read

concurrency:
  group: weather-${{ inputs.target || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare credentials yet — nothing to do."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.creds.outputs.ok == 'true'
      - name: Build the forecast tiles
        if: steps.creds.outputs.ok == 'true'
        run: npm run data:weather -- --env ${{ inputs.target || 'production' }}
